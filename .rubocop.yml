inherit_from: .rubocop_todo.yml
AllCops:
  StyleGuideBaseURL: https://github.com/bbatsov/ruby-style-guide
  # Gem requires Ruby >= 4.0 (see Rakefile GEMSPEC); RuboCop 1.80.2 only knows
  # up to 3.5, so we target the newest version it understands.
  TargetRubyVersion: 3.5
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'
    # Generated by `rake gemspec` (Gem::Specification#to_ruby); not hand-editable.
    - 'ffi-tk.gemspec'
Bundler/OrderedGems:
  Exclude:
    - 'Gemfile'
