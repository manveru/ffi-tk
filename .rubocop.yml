AllCops:
  StyleGuideBaseURL: https://github.com/bbatsov/ruby-style-guide
  # Gem requires Ruby >= 4.0 (see Rakefile GEMSPEC); RuboCop 1.80.2 only knows
  # up to 3.5, so we target the newest version it understands.
  TargetRubyVersion: 3.5
  # Lock the cop set to what this config governs; adopting newer cops is a
  # separate, deliberate step (run with --enable-pending-cops to preview).
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'
    # Generated by `rake gemspec` (Gem::Specification#to_ruby); not hand-editable.
    - 'ffi-tk.gemspec'
Bundler/OrderedGems:
  Exclude:
    - 'Gemfile'

# --- Deliberate project style choices (promoted from the auto-generated todo) ---

# Tk uses one- and two-letter coordinate/dimension parameters pervasively
# (x, y, w, h, r, g, b, dx, dy, ...); allow them while keeping the cop for
# genuinely forbidden names.
Naming/MethodParameterName:
  MinNameLength: 1

# Tk/C-style format strings use positional (%s, %d) tokens; annotated tokens
# would be noise here.
Style/FormatStringToken:
  EnforcedStyle: unannotated

# The gem's entry file must be named after the (hyphenated) gem so that
# `require 'ffi-tk'` works; it cannot be snake_case.
Naming/FileName:
  Exclude:
    - 'lib/ffi-tk.rb'

# grab.set_local/set_global and Tile.set_theme are action commands (Tk's
# `grab set`, `style theme use`), not attribute writers.
Naming/AccessorMethodName:
  Exclude:
    - 'lib/ffi-tk/command/grab.rb'
    - 'lib/ffi-tk/widget/tile.rb'

# Tk::Tile::Font holds an enum-like namespace of font-name constants
# (Font::Default, Font::Heading, ...) that are public API.
Naming/ConstantName:
  Exclude:
    - 'lib/ffi-tk/widget/tile.rb'

# pack/canvas expose long-standing positional boolean parameters; converting to
# keyword args would break every existing caller.
Style/OptionalBooleanParameter:
  Exclude:
    - 'lib/ffi-tk/command/pack.rb'
    - 'lib/ffi-tk/widget/canvas.rb'

# --- Test/example idioms (RuboCop defaults do not fit these contexts) ---

# bacon assertions read as void expressions (obj.should == x); autocorrecting
# would delete them.
Lint/Void:
  Exclude:
    - 'spec/**/*'

# Specs legitimately assert on exact geometry/progress float values.
Lint/FloatComparison:
  Exclude:
    - 'spec/**/*'

# Test helper classes are defined inside describe blocks; and the constants in
# these two files belong to a Struct-subclass body written as `Struct.new(...) do`.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'
    - 'lib/ffi-tk/ffi/tcl/eval_result.rb'
    - 'lib/ffi-tk/widget/canvas/item.rb'

# Test data (event sequences, widget dumps) contains long literal strings that
# do not wrap meaningfully.
Layout/LineLength:
  Exclude:
    - 'spec/**/*'

# Demo scripts use broad rescues, top-level globals, and camelCase method names
# ported from the Tcl/Tk demo sources.
Lint/RescueException:
  Exclude:
    - 'example/**/*'
Style/GlobalVars:
  Exclude:
    - 'example/**/*'
Naming/MethodName:
  Exclude:
    - 'example/**/*'

# Demo scripts and test fixtures are not library API; no class docs required.
Style/Documentation:
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'

# --- Metrics: pinned to the library's current shape ---
# ffi-tk is a thin, wide FFI binding whose command wrappers mirror Tk's own
# (deliberately large) API surface. These thresholds hold the library at its
# present complexity -- guarding regressions -- without forcing artificial
# decomposition of methods that map 1:1 onto Tk commands. Test/demo code exempt.
Metrics/MethodLength:
  Max: 29
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'
Metrics/AbcSize:
  Max: 29
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'
Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'
Metrics/PerceivedComplexity:
  Max: 14
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'
Metrics/ParameterLists:
  Max: 6
  MaxOptionalParameters: 4
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'

# Length cops keep RuboCop's default Max; only the specific classes/modules that
# mirror large Tk widgets/commands (and rake's task DSL) are exempt.
Metrics/ClassLength:
  Exclude:
    - 'example/**/*'
    - 'spec/**/*'
    - 'lib/ffi-tk/ffi/tcl/eval_result.rb'
    - 'lib/ffi-tk/widget/canvas.rb'
    - 'lib/ffi-tk/widget/canvas/item.rb'
    - 'lib/ffi-tk/widget/text.rb'
    - 'lib/ffi-tk/widget/tile/treeview.rb'
Metrics/ModuleLength:
  Exclude:
    - 'lib/ffi-tk/command/winfo.rb'
    - 'lib/ffi-tk/command/wm.rb'
    - 'lib/ffi-tk/ffi/tcl/eval_result.rb'
    - 'lib/ffi-tk/tk.rb'
Metrics/BlockLength:
  Exclude:
    - 'tasks/**/*'
    - 'example/**/*'
    - 'spec/**/*'
